      class_names: ["CAR", "TRUCK", "BUS", "MOTORCYCLE", "BICYCLE", "PEDESTRIAN", "ANIMAL", "BARRIER", "TRAFFIC_CONE", "DEBRIS"]
      num_anchor: 1800
      num_temp_instances: 1200
